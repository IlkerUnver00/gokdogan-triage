name: publish-testpypi

# DRY RUN to TestPyPI (a separate index from real PyPI). MANUAL ONLY.
# ONE-TIME SETUP on test.pypi.org first: add a "pending publisher" for this
# repo + this workflow (test.pypi.org -> account -> Publishing) with
# environment "testpypi" -- no token stored. Then run this by hand to verify
# the whole publish path end-to-end without touching real PyPI. TestPyPI also
# rejects a duplicate version, so a re-run needs a bumped version.
on:
  workflow_dispatch:

jobs:
  testpypi:
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write        # trusted publishing (OIDC) -- no stored token
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to TestPyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
