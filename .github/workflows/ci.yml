name: tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    # Windows runner so the integration suite can exercise real system
    # binaries (notepad.exe, kernel32.dll, mmc.exe) the way the tool ships.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install with dev extras (pytest and yara-python)
        run: pip install -e ".[dev]"

      - name: Run test suite
        run: pytest -q
