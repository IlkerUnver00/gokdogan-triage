name: publish

# Publish the sdist + wheel to PyPI. MANUAL ONLY (Actions → publish → Run
# workflow) so it never red-X's a release before PyPI is set up. ONE-TIME
# SETUP on PyPI first: add a "trusted publisher" for this repo + this
# workflow (PyPI → project → Publishing) — no API token is stored here.
# Once configured, run it by hand (optionally after tagging a release).
on:
  workflow_dispatch:

jobs:
  pypi:
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # trusted publishing (OIDC) — no stored token
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
