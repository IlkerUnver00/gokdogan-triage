name: publish

# Publish the sdist + wheel to PyPI. Runs on a version tag or a manual
# dispatch. ONE-TIME SETUP required on PyPI before this can succeed: add a
# "trusted publisher" for this repo+workflow (PyPI → project → Publishing),
# so no API token is stored here. Until that is configured the publish step
# fails harmlessly and does not affect the binary release in release.yml.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # trusted publishing (OIDC) — no stored token
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
