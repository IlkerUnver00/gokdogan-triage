[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gokdogan-triage"
version = "0.1.0"
description = "Static PE malware triage engine: imphash, entropy, packer detection, string classification, capability tagging, YARA, weighted verdict."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "İlker Ünver" }]
keywords = ["malware", "triage", "PE", "yara", "dfir", "static-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
]
dependencies = ["pefile>=2023.2.7", "ppdeep>=20200505"]

[project.optional-dependencies]
yara = ["yara-python>=4.3"]
tlsh = ["py-tlsh>=4.7"]
web = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.6", "yara-python>=4.3",
       "fastapi>=0.110", "httpx>=0.27", "python-multipart>=0.0.9"]

[project.scripts]
gokdogan = "gokdogan.cli:main"

[tool.setuptools.packages.find]
include = ["gokdogan*"]

[tool.setuptools.package-data]
gokdogan = ["rules/*.yar", "rules/*.yara"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# F = pyflakes (real errors), E/W = pycodestyle, I = import sorting,
# UP = pyupgrade, B = bugbear. Broad-except rules are intentionally off:
# a malware parser defensively swallows exceptions on hostile input.
select = ["F", "E", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
